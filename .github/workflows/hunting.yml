name: Run OpenCode with Prompt

on:
  push:
    paths:
      - 'prompt.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ========== CACHE OPENCODE BINARY ==========
      - name: Cache OpenCode binary
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.opencode
          key: ${{ runner.os }}-opencode-v1

      - name: Install OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://opencode.ai/install | bash

      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      # ========== CACHE PYTHON DEPENDENCIES ==========
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-websocket-client
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps
        run: |
          python3 -m pip install --user websocket-client
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ========== CACHE CHROMIUM ==========
      - name: Cache Chromium
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/chromium
          key: ${{ runner.os }}-chromium-v1

      - name: Install Chromium
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser

      # ========== BROWSER-MCP ==========
      - name: Cache browser-mcp repo
        id: cache-browser-mcp
        uses: actions/cache@v4
        with:
          path: browser-mcp
          key: ${{ runner.os }}-browser-mcp-v1

      - name: Clone browser-mcp
        if: steps.cache-browser-mcp.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/eye-fox/browser-mcp.git

      - name: Install browser-mcp
        run: |
          cd browser-mcp
          ./install.sh

      # ========== VERIFY & RUN ==========
      - name: Verify browser-mcp registered
        run: |
          cat "$HOME/.config/opencode/opencode.json" || echo "NOT FOUND"

      - name: Run OpenCode with Prompt
        run: |
          PROMPT=$(cat prompt.txt)
          opencode run "$PROMPT" -m opencode/muse-spark-1.3-contributor-free --auto

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: hasil_hunting
          path: 'hasil/**'
          if-no-files-found: error
